name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tags
        id: vars
        run: |
          # GHCR requires the image name to be lowercase; github.repository
          # isn't guaranteed to be, so lowercase it explicitly here.
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

          # workflow_dispatch has no branch push event, so github.ref_name
          # falls back to whatever ref was selected when triggering manually
          # (defaults to the repo's default branch unless chosen otherwise).
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "env_tag=latest-prod" >> "$GITHUB_OUTPUT"
          else
            echo "env_tag=latest-test" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            MODULE_BRANCH=${{ github.ref_name }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha_short }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.env_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha_short }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.env_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
